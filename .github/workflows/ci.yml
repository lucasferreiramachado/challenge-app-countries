name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  tests:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Configure GitHub Packages
        run: dotnet nuget update source github --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Restore
        run: |
          dotnet restore Countries/Countries.csproj
          dotnet restore Countries.Tests/Countries.Tests.csproj
      - name: Build Countries
        run: dotnet build Countries/Countries.csproj --configuration Release --framework net10.0 --no-restore
      - name: Test Countries
        run: dotnet test Countries.Tests/Countries.Tests.csproj --configuration Release --framework net10.0 --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx;LogFileName=countries-tests.trx"
      - name: Pack validation
        run: dotnet pack Countries/Countries.csproj --configuration Release --no-build --output artifacts
      - name: Publish test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countries-test-results-${{ github.sha }}
          path: |
            TestResults/
            artifacts/
          if-no-files-found: warn

  example-android:
    name: Build Android Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Configure GitHub Packages
        run: dotnet nuget update source github --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Build unsigned Android Example
        run: dotnet build Example/Example.csproj --configuration Release --framework net10.0-android -p:UseLocalModules=true

  example-ios:
    name: Build iOS Example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Configure GitHub Packages
        run: dotnet nuget update source github --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Install iOS workload
        run: dotnet workload install maui-ios
      - name: Build unsigned simulator iOS Example
        run: dotnet build Example/Example.csproj --configuration Release --framework net10.0-ios --runtime iossimulator-arm64 -p:EnableCodeSigning=false -p:UseLocalModules=true
