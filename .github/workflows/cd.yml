name: Publish NuGet package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  publish:
    name: Pack and publish ChallengeApp.Countries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Configure GitHub Packages
        run: dotnet nuget update source github --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Restore
        run:         dotnet restore Countries/Countries.csproj
      - name: Pack
        run: dotnet pack Countries/Countries.csproj --configuration Release --no-restore --output artifacts -p:TargetFrameworks=net10.0 -p:PackageVersion="1.0.0"
      - name: Validate package
        run: test -n "$(find artifacts -maxdepth 1 -name '*.nupkg' -print -quit)"
      - name: Publish package
        run: dotnet nuget push "artifacts/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: challengeapp-countries-package-${{ github.sha }}
          path: artifacts/
      - name: Summary
        run: |
          {
            echo "## ChallengeApp.Countries"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`1.0.0\`"
            echo "- Feed: GitHub Packages"
            echo "- Package: published"
          } >> "$GITHUB_STEP_SUMMARY"
